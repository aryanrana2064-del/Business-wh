<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | ARYAN VX7</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root{--gold:#D4A843;--gold-light:#F0D78C;--dark:#0A0A0A;--dark2:#111;--dark3:#1a1a1a;--glass:rgba(255,255,255,0.03);--glass-border:rgba(255,255,255,0.06);--text:#E0E0E0;--text-light:#999;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--font:'Inter',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);background:var(--dark);color:var(--text);min-height:100vh}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--dark2)}::-webkit-scrollbar-thumb{background:rgba(212,168,67,0.3)}
        
        .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(212,168,67,0.04) 0%,transparent 50%)}
        
        .nav{position:sticky;top:0;z-index:100;padding:12px 20px;background:rgba(10,10,10,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .nav h2{font-size:18px;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:50px;font-weight:600;font-size:12px;border:none;cursor:pointer;transition:.3s;font-family:var(--font);text-decoration:none}
        .btn-sm{padding:6px 12px;font-size:11px}
        .btn-primary{background:linear-gradient(135deg,var(--gold),#B8860B);color:#000}
        .btn-primary:hover{box-shadow:0 10px 25px rgba(212,168,67,0.3)}
        .btn-outline{background:transparent;border:1px solid var(--glass-border);color:#fff}
        .btn-outline:hover{border-color:var(--gold)}
        .btn-green{background:var(--green);color:#000}
        .btn-red{background:var(--red);color:#fff}
        
        .container{max-width:900px;margin:0 auto;padding:20px;position:relative;z-index:1}
        
        .card{background:var(--glass);backdrop-filter:blur(15px);border:1px solid var(--glass-border);border-radius:16px;padding:24px;margin-bottom:20px}
        .card h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        
        .qr-section{text-align:center}
        #qrCodeContainer{display:inline-block;background:#fff;padding:10px;border-radius:12px;margin:16px 0}
        .qr-status{font-size:13px;margin-top:8px}
        .qr-status.connected{color:var(--green)}
        .qr-status.disconnected{color:var(--red)}
        
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text-light);text-transform:uppercase;letter-spacing:1px}
        .form-group textarea,.form-group input{width:100%;padding:12px;background:var(--dark3);border:1px solid var(--glass-border);border-radius:10px;color:#fff;font-family:var(--font);font-size:13px;resize:vertical;outline:none;transition:.3s}
        .form-group textarea:focus,.form-group input:focus{border-color:var(--gold)}
        .form-group textarea{min-height:120px}
        
        .switch{position:relative;display:inline-block;width:48px;height:26px}
        .switch input{opacity:0;width:0;height:0}
        .slider{position:absolute;cursor:pointer;inset:0;background:var(--dark3);border-radius:26px;transition:.3s;border:1px solid var(--glass-border)}
        .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
        input:checked+.slider{background:var(--green)}
        input:checked+.slider:before{transform:translateX(22px)}
        
        .toggle-row{display:flex;justify-content:space-between;align-items:center}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
        .stat-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:16px;text-align:center}
        .stat-card h4{font-size:22px;color:var(--gold)}
        .stat-card p{font-size:11px;color:var(--text-light)}
        
        .reply-preview{background:var(--dark3);border-radius:12px;padding:16px;margin-top:12px;font-size:13px;white-space:pre-wrap;line-height:1.6}
        
        .toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;border:1px solid var(--gold);border-radius:12px;padding:14px 20px;z-index:9999;display:none;color:#fff;font-size:13px}
        .toast.show{display:block;animation:slideIn .3s}
        @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
        
        @media(max-width:600px){.container{padding:12px}.card{padding:16px}}
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="toast" id="toast"></div>

    <nav class="nav">
        <h2>👑 ARYAN VX7 Admin</h2>
        <div style="display:flex;gap:8px;align-items:center">
            <span id="adminEmail" style="font-size:12px;color:var(--text-light)"></span>
            <a href="/" class="btn btn-outline btn-sm">🏠 Website</a>
            <button class="btn btn-red btn-sm" onclick="signOut()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card"><h4 id="statMessages">0</h4><p>Messages Today</p></div>
            <div class="stat-card"><h4 id="statClients">0</h4><p>Total Clients</p></div>
            <div class="stat-card"><h4 id="statProjects">0</h4><p>Active Projects</p></div>
            <div class="stat-card"><h4 id="statRevenue">₹0</h4><p>Revenue</p></div>
        </div>

        <!-- WhatsApp QR Section -->
        <div class="card qr-section">
            <h3><i class="fab fa-whatsapp" style="color:#25D366"></i> WhatsApp Bot Connection</h3>
            <p style="font-size:13px;color:var(--text-light);margin-bottom:12px">Scan QR Code to connect WhatsApp Auto-Reply Bot</p>
            <div id="qrCodeContainer"></div>
            <p class="qr-status disconnected" id="qrStatus"><i class="fas fa-circle"></i> Disconnected</p>
            <button class="btn btn-primary" onclick="generateQR()"><i class="fas fa-qrcode"></i> Generate New QR</button>
            <button class="btn btn-outline btn-sm" onclick="disconnectBot()" style="margin-left:8px"><i class="fas fa-power-off"></i> Disconnect</button>
        </div>

        <!-- Bot Settings -->
        <div class="card">
            <h3><i class="fas fa-cog"></i> Auto-Reply Settings</h3>
            
            <div class="form-group">
                <div class="toggle-row">
                    <label>Enable Auto-Reply</label>
                    <label class="switch">
                        <input type="checkbox" id="autoReplyToggle" onchange="saveSettings()" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Auto-Reply Message</label>
                <textarea id="autoReplyMessage" onchange="saveSettings()" placeholder="Type your auto-reply message...">🚀 *ARYAN VX7 — Premium Digital Agency*

Thanks for messaging! 🙏

🌐 *Our Services:*
• Website Development
• Cinematic Video Shooting
• Professional Video Editing
• Branding & Creative Design
• Social Media Content

✨ *Why Choose Us?*
✔ Premium Quality
✔ Modern & Creative Designs
✔ Fast Delivery
✔ Affordable Pricing
✔ Professional Support

━━━━━━━━━━━━━━━━━━
📞 Call: +91 9105315121
🌐 Visit: https://aryan-vx7.vercel.app

_I'll reply personally soon!_ 🙏</textarea>
            </div>

            <div class="reply-preview" id="replyPreview"></div>

            <button class="btn btn-primary" onclick="saveSettings()" style="margin-top:12px"><i class="fas fa-save"></i> Save Settings</button>
        </div>

        <!-- Quick Replies -->
        <div class="card">
            <h3><i class="fas fa-comments"></i> Quick Reply Templates</h3>
            <div id="quickReplies"></div>
            <button class="btn btn-outline btn-sm" onclick="addQuickReply()" style="margin-top:12px"><i class="fas fa-plus"></i> Add Reply</button>
        </div>
    </div>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAwmibMJ-4IcSevD0f43GfED-HqH9E6qoU",
            authDomain: "vx77-c7f7e.firebaseapp.com",
            databaseURL: "https://vx77-c7f7e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vx77-c7f7e",
            storageBucket: "vx77-c7f7e.firebasestorage.app",
            messagingSenderId: "773582293799",
            appId: "1:773582293799:web:4da808721ee4bfbe91f702"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const ADMIN_EMAILS = ['admin@bgmi.com', 'aryanvx7@gmail.com'];

        // Check Admin
        auth.onAuthStateChanged(async u => {
            if (!u || !ADMIN_EMAILS.includes(u.email)) {
                showToast('⛔ Access Denied!');
                setTimeout(() => location.href = '/', 2000);
                return;
            }
            document.getElementById('adminEmail').textContent = u.email;
            loadSettings();
            loadStats();
            generateQR();
        });

        // Generate QR Code
        function generateQR() {
            const container = document.getElementById('qrCodeContainer');
            container.innerHTML = '';
            const botNumber = document.getElementById('botNumber')?.value || '919286928539';
            const qrText = `https://wa.me/${botNumber}?text=Hi%20ARYAN%20VX7`;
            
            new QRCode(container, {
                text: qrText,
                width: 180,
                height: 180,
                colorDark: '#000',
                colorLight: '#fff'
            });
            
            document.getElementById('qrStatus').innerHTML = '<i class="fas fa-circle"></i> QR Ready — Scan with WhatsApp';
            document.getElementById('qrStatus').className = 'qr-status connected';
            showToast('✅ QR Code Generated!');
        }

        function disconnectBot() {
            document.getElementById('qrStatus').innerHTML = '<i class="fas fa-circle"></i> Disconnected';
            document.getElementById('qrStatus').className = 'qr-status disconnected';
            showToast('Bot disconnected');
        }

        // Load Settings
        function loadSettings() {
            db.ref('botSettings').once('value').then(snap => {
                const data = snap.val() || {};
                document.getElementById('autoReplyToggle').checked = data.autoReplyEnabled !== false;
                document.getElementById('autoReplyMessage').value = data.autoReplyMessage || document.getElementById('autoReplyMessage').value;
                updatePreview();
            });
        }

        // Save Settings
        function saveSettings() {
            const settings = {
                autoReplyEnabled: document.getElementById('autoReplyToggle').checked,
                autoReplyMessage: document.getElementById('autoReplyMessage').value,
                updatedAt: new Date().toISOString()
            };
            db.ref('botSettings').set(settings).then(() => {
                showToast('✅ Settings Saved!');
                updatePreview();
            });
        }

        function updatePreview() {
            const msg = document.getElementById('autoReplyMessage').value;
            document.getElementById('replyPreview').innerHTML = msg.replace(/\n/g, '<br>').replace(/\*/g, '');
        }

        // Load Stats
        function loadStats() {
            db.ref('botStats').once('value').then(snap => {
                const data = snap.val() || {};
                document.getElementById('statMessages').textContent = data.messages || 0;
                document.getElementById('statClients').textContent = data.clients || 0;
                document.getElementById('statProjects').textContent = data.projects || 0;
                document.getElementById('statRevenue').textContent = '₹' + (data.revenue || 0);
            });
        }

        // Quick Replies
        function loadQuickReplies() {
            db.ref('quickReplies').once('value').then(snap => {
                const replies = snap.val() || {};
                const html = Object.entries(replies).map(([key, val]) => `
                    <div style="background:var(--dark3);padding:12px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
                        <div><strong>${key}</strong><br><small style="color:var(--text-light)">${val.substring(0,50)}...</small></div>
                        <button class="btn btn-red btn-sm" onclick="deleteReply('${key}')"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
                document.getElementById('quickReplies').innerHTML = html || '<p style="color:var(--text-light);font-size:13px">No quick replies yet</p>';
            });
        }

        function addQuickReply() {
            const key = prompt('Trigger word (e.g., "menu", "price"):');
            if (!key) return;
            const val = prompt('Reply message:');
            if (!val) return;
            db.ref('quickReplies/' + key).set(val).then(() => {
                showToast('✅ Quick Reply Added!');
                loadQuickReplies();
            });
        }

        function deleteReply(key) {
            db.ref('quickReplies/' + key).remove().then(() => {
                showToast('Deleted!');
                loadQuickReplies();
            });
        }

        function signOut() {
            auth.signOut().then(() => location.href = '/');
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.textContent = m;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Init
        loadQuickReplies();
        updatePreview();
    </script>
</body>
</html>
